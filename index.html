<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akihabara for Perry: 3 ways to spend the day</title>
<meta name="description" content="Three plans for your Akihabara day, all 10:00 to 15:00, laid out like a TV listings page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEEDE8;--ink:#15171C;--a:#D8321F;--b:#1F4FB5;--c:#15171C;--rule:rgba(21,23,28,.28);--axis:64px;
--sans:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--serif);-webkit-font-smoothing:antialiased;word-break:auto-phrase;overflow-wrap:anywhere}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}

/* cover */
.facts{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:16px;border-top:6px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0}
.facts div{font:600 17px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.facts span{display:block;font-weight:500;font-size:13px;letter-spacing:.16em;opacity:.7}
.mast{font:800 min(9vw,116px)/.92 var(--sans);text-transform:uppercase;letter-spacing:-.005em;padding:22px 0 14px;white-space:nowrap;animation:rise .6s ease-out both}
.mastart{display:block;height:auto;width:100%;aspect-ratio:2.6/1;object-fit:cover;object-position:50% 45%;margin:0 0 14px}
.endart{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:cover;object-position:50% 60%;margin:28px 0 0}
.band{display:flex;justify-content:space-between;align-items:baseline;gap:16px;background:var(--ink);color:var(--paper);padding:10px 18px 8px;font:700 clamp(22px,3.4vw,40px)/1.1 var(--sans);text-transform:uppercase;letter-spacing:.03em}
.band span:last-child{color:var(--paper)}
.band b{font-weight:700;background:var(--a);padding:0 10px 1px;margin-right:2px}
.deckrow{display:grid;grid-template-columns:5fr 7fr;gap:40px;padding:28px 0 36px;border-bottom:2px solid var(--ink)}
.deck{font:700 clamp(30px,3.4vw,46px)/1.05 var(--sans);text-transform:uppercase;text-wrap:balance}
.lead{font-size:19px;line-height:1.55;max-width:58ch;text-wrap:pretty}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* tabs (small screens only) */
.tabs{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;min-height:60px;padding:6px 6px 8px;text-align:left;border-bottom:4px solid var(--cc);display:flex;flex-direction:column;justify-content:flex-start}
.tab i{font:800 28px/1 var(--sans);font-style:normal}
.tab span{font:600 14px/1.15 var(--sans);letter-spacing:.03em;text-transform:uppercase}
.tab[aria-selected=true]{background:var(--cc);color:#fff}
.ch-A{--cc:var(--a)}.ch-B{--cc:var(--b)}.ch-C{--cc:var(--c)}

/* the listings grid */
.listings{padding-top:34px;padding-bottom:8px}
.guide{display:grid;grid-template-columns:var(--axis) repeat(var(--n),minmax(0,1fr))}
.intro{grid-row:1;padding:0 18px 22px}
.intro+.intro{border-left:1px solid var(--rule)}
.still{position:relative;aspect-ratio:16/10;margin:0 0 14px;overflow:hidden;background:var(--ink)}
.still img{width:100%;height:100%;object-fit:cover;display:block}
.still b{position:absolute;left:0;bottom:0;width:60px;height:60px;display:grid;place-items:center;background:var(--cc);color:#fff;font:800 44px/1 var(--sans)}
.intro h2{font:800 clamp(17px,1.45vw,21px)/1.15 var(--sans);letter-spacing:.01em;white-space:nowrap}
.intro .tag{font:600 15px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--cc);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px 0;margin:10px 0 12px}
.chips li{font:600 14px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:0 12px;border-left:1px solid var(--ink)}
.chips li:first-child{padding-left:0;border-left:0}
.why{font-size:16px;line-height:1.55;text-wrap:pretty}
.tm{grid-column:1;text-align:right;padding:11px 12px 0 0;font:600 16px/1.2 var(--sans);font-variant-numeric:tabular-nums;border-top:1px solid var(--rule)}
.slot{border-top:2px solid var(--cc);padding:10px 18px 18px}
.slot-in{padding-left:18px}
.guide .slot:not(.c0){border-left:1px solid var(--rule)}
.slot header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.slot h3{font:700 20px/1.12 var(--sans);text-transform:uppercase;letter-spacing:.015em;text-wrap:balance}
.dur{font:600 15px var(--sans);letter-spacing:.04em;color:var(--cc);white-space:nowrap;font-variant-numeric:tabular-nums}
.slot p{font-size:15.5px;line-height:1.5;margin-top:6px;text-wrap:pretty}
.slot.lunch{background:var(--cc);color:#fff}
@media (max-width:900px){.slot.lunch{padding-right:12px}}
.slot.lunch .dur{color:#fff}
.endt{grid-column:1;text-align:right;padding:11px 12px 0 0;font:700 16px/1.2 var(--sans);border-top:2px solid var(--ink)}
.endl{grid-column:2/-1;border-top:2px solid var(--ink)}
.fine{padding:20px 18px 6px}
.fine+.fine{border-left:1px solid var(--rule)}
.fine h4{font:700 14px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0 0 4px}
.fine p{font-size:15px;line-height:1.5;margin-bottom:14px;text-wrap:pretty}
.links{display:flex;flex-wrap:wrap;gap:0 16px;margin:0 0 10px}
.links a{display:inline-flex;align-items:center;min-height:44px;font:600 15px var(--sans);letter-spacing:.03em;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;background:var(--cc);color:#fff;text-decoration:none;font:700 17px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase}
.btn:hover{background:var(--ink)}

/* meet + footer */
.meet{display:grid;grid-template-columns:5fr 7fr;gap:40px;padding:44px 0 40px;border-top:6px solid var(--ink);margin-top:36px}
.meet h2{font:800 clamp(34px,4vw,52px)/1 var(--sans);text-transform:uppercase}
.meet .sub{font:600 16px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin:8px 0 18px}
.meet p{max-width:52ch;margin-bottom:12px;text-wrap:pretty}
.meet iframe{display:block;width:100%;height:340px;border:0;background:var(--rule)}
.meet .btn{margin-top:10px;--cc:var(--ink)}
.note{font-size:14px;line-height:1.5;opacity:.85;max-width:62ch;padding-bottom:36px}
.reply{background:var(--a);color:#fff;padding:34px 0 30px}
.reply p:first-child{font:800 clamp(30px,4.2vw,56px)/1.05 var(--sans);text-transform:uppercase;text-wrap:balance}
.reply p+p{font:600 16px var(--sans);letter-spacing:.04em;margin-top:12px}

@media (max-width:900px){
  .mastart{aspect-ratio:16/10;margin:0 -16px 10px;width:calc(100% + 32px)}
  .wrap{padding:0 16px}
  .mast{font-size:9.3vw;padding:16px 0 10px}
  .facts{grid-template-columns:.75fr 1.5fr 1.1fr;gap:10px}
  .facts div{font-size:15px}
  .deckrow{grid-template-columns:1fr;gap:12px;padding:20px 0 24px}
  .lead{font-size:17px}
  .listings{padding-top:0}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);margin:0 -16px;padding:0 16px;gap:6px}
  .guide{--axis:50px}
  .intro{grid-column:1/-1!important;padding:18px 0 14px}
  .still{aspect-ratio:2/1;margin:0 0 12px}
  .intro h2{font-size:20px;white-space:normal}
  .tm{padding-right:10px}
  .slot{padding:10px 0 16px 12px}
  .slot-in{padding-left:12px}
  .fine{padding:18px 0 6px 12px}
  .meet{grid-template-columns:1fr;gap:20px;padding:30px 0}
  .meet iframe{height:260px}
  .endl{grid-column:2/-1}
}
@media (max-width:420px){
  .band{padding:8px 12px 6px;font-size:23px}
  .tab i{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.mast{animation:none}}
</style>
</head>
<body>
<header class="wrap">
  <div class="facts" id="facts"></div>
  <h1 class="mast">Saturday morning, Tokyo</h1>
  <img class="mastart" src="img/gundam.jpg" alt="A Wing Gundam Zero model with white feathered wings in a glass case at a hobby shop in Akihabara">
  <p class="band"><span><b>3 plans</b></span><span>all 10:00 to 15:00</span></p>
  <div class="deckrow"><p class="deck" id="deck"></p><p class="lead" id="lead"></p></div>
</header>

<main class="wrap listings">
  <div class="tabs" role="tablist" aria-label="Choose a course" id="tabs"></div>
  <div class="guide" id="guide" role="tabpanel" aria-live="polite"></div>

  <section class="meet" aria-labelledby="meet-h">
    <div>
      <h2 id="meet-h">Where we meet</h2>
      <p class="sub" id="meet-sub"></p>
      <p id="meet-text"></p>
      <p id="meet-hint"></p>
      <a class="btn" id="meet-link" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>
    <iframe id="meet-map" loading="lazy" title="Akihabara Station Electric Town Exit" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>
  <p class="note" id="note"></p>
</main>

<footer class="reply"><div class="wrap"><p id="reply-1"></p><p id="reply-2"></p></div></footer>

<script>
const PAGE={"title": "Akihabara for Perry: 3 ways to spend the day", "kicker": "Tokyo · Jan 12 or 13, 2027", "h1": "Three ways to spend <span class=\"nb\">the day.</span>", "lead": "Three plans for your day, all 10:00 to 15:00. Pick by what you want to see; I can shorten any of them if the jet lag is heavy.", "facts": [["Guide", "Yuuki"], ["Day", "Tue Jan 12 or Wed Jan 13"], ["Time", "10:00 to 15:00"]], "subject": "Perry — Akihabara plan", "meet_sub": "The same start for every course", "meet_text": "Akihabara Station, Electric Town exit, at 10:00. If you would rather I come to you, I can meet you in your hotel lobby instead.", "meet_hint": "Come out of the Electric Town exit and Radio Kaikan is the tall building straight ahead.", "meet_place": "Akihabara Station Electric Town Exit", "footer": "Reply to Yuuki with the letter of the course you want. Times are approximate and can move on the day.", "note": "Checked on the shops' official sites in October 2026. None lists a regular closing day on a Tuesday or Wednesday, but Shibuya PARCO closes on irregular days. I will re-check the week before."};
const COURSES=[{"id": "A", "name": "90s shonen and retro games", "tag": "Retro games, old manga and toys", "chips": ["5 hours", "Akihabara only", "Retro games"], "why": "For Dragon Ball Z, Digimon, Cowboy Bebop, Mario and Zelda. We go through the 1990s shonen and game shelves: toys and figures, retro consoles, old manga, and a second-hand game shop for anything on your list.", "steps": [["10:00", "Akihabara Station, Electric Town exit", "We meet here. Radio Kaikan is across the street, so there is almost no walking to start. If you are tired, tell me and we slow down."], ["10:10", "Akihabara Radio Kaikan", "Ten floors facing the station. We take the lift to the top and walk down. Figures and toys are on 3F to 7F, and K-BOOKS is on 3F."], ["11:00", "Super Potato Akihabara", "Famicom to PlayStation 2 on the 3rd and 4th floors, plus handhelds and Sega. The early Mario and Zelda games are on the Famicom and Super Famicom shelves. The 5th floor is a small retro arcade with a place to sit."], ["11:50", "Lunch at Go!Go!Curry", "Kanazawa curry: a pork cutlet on a dark, thick roux, eaten at the counter. It is quick and close to the station."], ["12:40", "Mandarake Complex Akihabara", "Boys' manga and vintage books on 3F. Toys on 6F to 8F, with Chogokin on 7F and robots on 8F. Stock changes every week, so we see what is there that day."], ["13:45", "Surugaya Akihabara Game-kan", "A second-hand game shop with deep stock: retro and current games, strategy guides and game magazines. Its website lets you search the shop, so we can look up a title from your list first. We finish here around 15:00."]], "stops": ["Akihabara Station Electric Town Exit", "Akihabara Radio Kaikan", "Super Potato Akihabara", "Go!Go!Curry Akihabara", "Mandarake Complex Akihabara", "Surugaya Akihabara Game-kan"], "moves": "All on foot. Radio Kaikan is across the street from the station, and the rest of the day moves north toward Mandarake and Surugaya, with short walks between shops.", "mind": "Check that a Japanese game runs on your console at home, and on 100 V power, before you buy. A Famicom cartridge does not fit an NES without an adapter. Go!Go!Curry takes cash only, so bring some for the smaller shops too.", "links": [["Radio Kaikan", "https://akihabara-radiokaikan.co.jp/"], ["Super Potato", "https://www.superpotato.com/shop/akihabara/"], ["Mandarake Complex", "https://www.mandarake.co.jp/dir/cmp/"], ["Surugaya Game-kan", "https://www.suruga-ya.jp/feature/realstore/akihabara_game/index.html"]]}, {"id": "B", "name": "Gundam and models", "tag": "Gunpla and model shops, with a retro stop", "chips": ["5 hours", "Akihabara only", "Gunpla and models"], "why": "For Gundam Wing. The morning and early afternoon are the model shops, with a stop at Super Potato and Radio Kaikan so the day is not only kits. You could leave with a Gunpla kit and a few tools, small enough to build in your hotel room and carry home.", "steps": [["10:00", "Akihabara Station, Electric Town exit", "We meet here. Yodobashi is one minute away, so the first shop is almost at the door."], ["10:05", "Yodobashi Akiba", "Plastic models, modelling tools, figures and games are all on the 6th floor. We start with the current Gunpla kits and the tools you would need to build one. I can help you choose a kit, a Wing Gundam one if there is one in stock."], ["11:05", "Kotobukiya Akihabara-kan", "The figure and model kit maker's own shop. It sells new releases and shop-only items, and the pop-ups change, so we see what is on that week."], ["11:50", "Super Potato Akihabara", "A short stop so the day is not only models. Famicom to PlayStation 2 on the 3rd and 4th floors, and a small retro arcade on the 5th."], ["12:30", "Lunch at Go!Go!Curry", "Kanazawa curry: a pork cutlet on a dark, thick roux, eaten at the counter. It is quick and close to the station. If you would rather sit down for a steak, Juke Steak serves lunch and I can swap it in."], ["13:20", "Volks Hobby Tengoku 2", "Seven floors of kits, figures and goods. Volks's own kits are on 4F, and the 6th and 7th floors host pop-up events that change."], ["14:25", "Akihabara Radio Kaikan", "A short last stop, facing the station. Kaiyodo is on 5F, Yellow Submarine with its model kits on 6F, and Volks on 8F. We finish here at 15:00, right by the station."]], "stops": ["Akihabara Station Electric Town Exit", "Yodobashi Akiba", "Kotobukiya Akihabara-kan", "Super Potato Akihabara", "Go!Go!Curry Akihabara", "Volks Hobby Tengoku 2 Akihabara", "Akihabara Radio Kaikan"], "moves": "All on foot. We work from the station south to Kotobukiya and Super Potato, then north to Volks, and come back to Radio Kaikan by the station to finish.", "mind": "Go!Go!Curry takes cash only, so bring some for the smaller shops too. The Dragon Ball Store is not in Akihabara: it is on the 1st floor of Tokyo Station Ichibangai, two stops away, and I can add it if you want it.", "links": [["Yodobashi Akiba", "https://www.yodobashi-akiba.com/"], ["Kotobukiya", "https://www.kotobukiya.co.jp/kotobukiya-shop/"], ["Volks Hobby Tengoku 2", "https://hobby.volks.co.jp/shop/hobbytengoku2/"], ["Super Potato", "https://www.superpotato.com/shop/akihabara/"], ["Radio Kaikan", "https://akihabara-radiokaikan.co.jp/"]]}, {"id": "C", "name": "Akihabara and Shibuya: Nintendo and Pokémon", "tag": "Akihabara in the morning, Nintendo and Pokémon after lunch", "chips": ["5 hours", "Akihabara + Shibuya", "One train ride"], "why": "For Mario, Zelda and Pokémon. The morning is Akihabara for two stops, then one train to Shibuya, where Nintendo TOKYO and the Pokémon Center are on the same floor.", "steps": [["10:00", "Akihabara Station, Electric Town exit", "We meet here. Radio Kaikan is across the street."], ["10:10", "Akihabara Radio Kaikan", "Ten floors facing the station. We take the lift to the top and walk down. Figures and toys are on 3F to 7F."], ["11:00", "Super Potato Akihabara", "Famicom to PlayStation 2 on the 3rd and 4th floors. The early Mario and Zelda games are on the Famicom and Super Famicom shelves. The 5th floor is a small retro arcade."], ["12:15", "Train from Akihabara to Shibuya", "About 30 to 40 minutes by train. I ride with you and tell you which line to take."], ["12:55", "Lunch in Shibuya PARCO", "The restaurants are on the 7th floor of the same building as the stores. We eat there, then go down one floor."], ["13:35", "Nintendo TOKYO", "Nintendo's own store on the 6th floor of Shibuya PARCO, five minutes on foot from Shibuya Station. On busy days entry is by numbered ticket, and a weekday is calmer. I check the store's page that morning."], ["14:20", "Pokémon Center Shibuya", "The official Pokémon store, on the same floor. We finish here at 15:00."]], "stops": ["Akihabara Station Electric Town Exit", "Akihabara Radio Kaikan", "Super Potato Akihabara", "Shibuya Station", "Nintendo TOKYO Shibuya PARCO", "Pokémon Center Shibuya"], "moves": "Akihabara on foot in the morning, then one train ride of about 30 to 40 minutes. In Shibuya, lunch and both stores are in the same building, so there is almost no walking.", "mind": "Shibuya PARCO has irregular closing days, so I check its calendar the week before. New Pokémon card products are sold by advance lottery, so sealed packs are unlikely, but the store is worth it for everything else.", "links": [["Nintendo TOKYO", "https://www.nintendo.com/jp/officialstore/index.html"], ["Pokémon Center Shibuya", "https://shop.pokemon.co.jp/ja/shop/pokemoncenter-shibuya/"], ["Shibuya PARCO", "https://shibuya.parco.jp/info/"]]}];
const EXTRA={
  A:{short:"Retro games",img:"img/retro-arcade.jpg",pos:"50% 62%",alt:"A Street Fighter II arcade cabinet at a retro arcade in Akihabara"},
  B:{short:"Gunpla",img:"img/gundam.jpg",pos:"50% 50%",alt:"Wing Gundam Zero model with white feathered wings in a glass display case"},
  C:{short:"Nintendo and Pokémon",img:"img/pokemon.jpg",pos:"50% 52%",alt:"A hand holding a Pikachu ex trading card"}
};
const MEET="Akihabara+Station+Electric+Town+Exit";
const $=id=>document.getElementById(id);
const el=(tag,cls,txt,attrs)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e};
const mins=s=>{const p=s.split(":");return +p[0]*60+ +p[1]};
const q=s=>s.replace(/ /g,"+");
const routeLink=st=>{const s=st.map(q);return "https://www.google.com/maps/dir/?api=1&origin="+s[0]+"&destination="+s[s.length-1]+(s.length>2?"&waypoints="+s.slice(1,-1).join("%7C"):"")+"&travelmode=transit"};

// static bits
PAGE.facts.forEach(f=>{const d=el("div");d.append(el("span",null,f[0]),document.createTextNode(f[1]));$("facts").append(d)});
$("deck").textContent=PAGE.h1.replace(/<[^>]+>/g,"");
$("lead").textContent=PAGE.lead;
$("meet-sub").textContent=PAGE.meet_sub;
$("meet-text").textContent=PAGE.meet_text;

$("meet-map").src="https://maps.google.com/maps?q="+MEET+"&output=embed&z=15";
$("note").textContent=PAGE.note;
const sentences=PAGE.footer.split(/(?<=\.)\s+/);
$("reply-1").textContent=sentences[0];
$("reply-2").textContent=sentences.slice(1).join(" ");

// tabs
let active=0;
const mq=matchMedia("(max-width:900px)");
COURSES.forEach((c,i)=>{
  const b=el("button","tab ch-"+c.id,null,{type:"button",role:"tab",id:"tab-"+c.id,"aria-selected":"false"});
  b.append(el("i",null,c.id),el("span",null,EXTRA[c.id].short));
  b.addEventListener("click",()=>{active=i;render();});
  b.addEventListener("keydown",e=>{
    const d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(!d)return;
    active=(i+d+COURSES.length)%COURSES.length;render();$("tab-"+COURSES[active].id).focus();
  });
  $("tabs").append(b);
});

function render(){
  const small=mq.matches, idx=small?[active]:COURSES.map((_,i)=>i);
  const g=$("guide");g.replaceChildren();g.style.setProperty("--n",idx.length);
  // one grid row per distinct start time across the visible channels
  const times=[...new Set(idx.flatMap(i=>COURSES[i].steps.map(s=>mins(s[0]))))].sort((a,b)=>a-b);
  const END=15*60; times.push(END);
  const n=times.length-1, line=t=>times.indexOf(t)+2; // grid line of a time
  g.style.gridTemplateRows="auto "+times.slice(0,-1).map((t,k)=>"minmax("+Math.round((times[k+1]-t)*.9)+"px,auto)").join(" ")+" auto auto";
  const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

  idx.forEach((ci,col)=>{
    const c=COURSES[ci],x=EXTRA[c.id],cc="ch-"+c.id;
    const intro=el("div","intro "+cc);intro.style.gridColumn=col+2;
    const fig=el("figure","still");const im=el("img",null,null,{src:x.img,alt:x.alt,loading:"lazy"});im.style.objectPosition=x.pos;
    fig.append(im,el("b",null,c.id));
    const chips=el("ul","chips");c.chips.forEach(t=>chips.append(el("li",null,t)));
    intro.append(fig,el("h2",null,c.name),el("p","tag",c.tag),chips,el("p","why",c.why));
    g.append(intro);

    c.steps.forEach((s,k)=>{
      const st=mins(s[0]),en=k+1<c.steps.length?mins(c.steps[k+1][0]):END;
      const lunch=/^lunch/i.test(s[1]);
      const slot=el("article","slot "+cc+(lunch?" lunch":"")+(col?"":" c0"));
      slot.style.gridColumn=col+2;slot.style.gridRow=line(st)+" / "+line(en);
      const hd=el("header");hd.append(el("h3",null,s[1]),el("span","dur",(en-st)+" min"));
      slot.append(hd,el("p",null,s[2]));g.append(slot);
    });

    const fine=el("div","fine "+cc);fine.style.gridColumn=col+2;fine.style.gridRow=n+3;
    fine.append(el("h4",null,"Getting around"),el("p",null,c.moves),el("h4",null,"Keep in mind"),el("p",null,c.mind));
    const ln=el("div","links");c.links.forEach(l=>ln.append(el("a",null,l[0],{href:l[1],target:"_blank",rel:"noopener"})));
    fine.append(ln,el("a","btn","Open the route in Google Maps",{href:routeLink(c.stops),target:"_blank",rel:"noopener"}));
    g.append(fine);
  });

  times.forEach((t,k)=>{
    if(k===n)return;
    const a=el("div","tm",fmt(t));a.style.gridRow=k+2;g.append(a);
  });
  const e1=el("div","endt","15:00");e1.style.gridRow=n+2;const e2=el("div","endl");e2.style.gridRow=n+2;
  e2.style.gridColumn="2/-1";g.append(e1,e2);

  [...$("tabs").children].forEach((b,i)=>{b.setAttribute("aria-selected",String(i===active));b.tabIndex=i===active?0:-1});
  g.setAttribute("aria-labelledby","tab-"+COURSES[active].id);
}
mq.addEventListener("change",render);
render();
// keep the masthead on one line even if the web font is slow or missing
const fitMast=()=>{const m=document.querySelector(".mast");m.style.fontSize="";let s=parseFloat(getComputedStyle(m).fontSize);while(m.scrollWidth>m.clientWidth&&s>20){s-=1;m.style.fontSize=s+"px"}};
fitMast();addEventListener("resize",fitMast);(document.fonts?document.fonts.ready:Promise.resolve()).then(fitMast);
</script>
